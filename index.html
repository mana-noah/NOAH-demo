<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>六界石・最小体験プロトタイプ v2</title>
<style>
:root{--bg:#10121a;--panel:#181c27;--line:#303747;--text:#eef2f7;--muted:#aeb7c7;--accent:#b7e5c0;--clue:#d9c48b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
main{max-width:760px;margin:auto;padding:16px 14px 28px}
h1{font-size:20px;margin:0 0 4px}.sub{font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:12px}
.world{position:relative;height:390px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(#1a2a1d,#111b14 72%,#0e1511);touch-action:none;user-select:none}
.world:before{content:"";position:absolute;inset:0;opacity:.23;background-image:linear-gradient(35deg,transparent 48%,#6c805d 49%,transparent 51%),linear-gradient(-35deg,transparent 48%,#6c805d 49%,transparent 51%);background-size:90px 90px}
.compass{position:absolute;right:12px;top:10px;z-index:4;font-size:11px;color:#d6ddce;line-height:1.25;text-align:center;opacity:.75}.compass b{font-size:13px}
.region{position:absolute;z-index:1;border:1px dashed rgba(214,221,206,.18);border-radius:50%;pointer-events:none}.region.ne{left:55%;top:8%;width:38%;height:38%}.region.center{left:28%;top:31%;width:40%;height:38%}.region.sw{left:7%;top:58%;width:38%;height:30%}
.region-label{position:absolute;z-index:2;font-size:9px;color:rgba(214,221,206,.42);pointer-events:none}.r-ne{right:14%;top:43%}.r-center{left:39%;top:67%}.r-sw{left:10%;top:84%}
.player,.npc{position:absolute;z-index:5;transform:translate(-50%,-50%);user-select:none}.player{width:34px;height:34px;border-radius:50%;background:#dce8ff;border:3px solid #7185aa;box-shadow:0 0 14px #b9d0ff88}.player:after{content:"MANA";position:absolute;top:35px;left:50%;transform:translateX(-50%);font-size:10px;color:#dce8ff;white-space:nowrap}
.npc{width:32px;height:32px;border-radius:8px;background:#d0a5e8;border:3px solid #76568a}.npc:after{content:"旅人";position:absolute;top:34px;left:50%;transform:translateX(-50%);font-size:10px;color:#e7d9ef;white-space:nowrap}
.panel{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.status{font-size:13px;line-height:1.55;min-height:42px}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px}button{border:1px solid #3b4558;background:#222838;color:var(--text);border-radius:12px;min-height:47px;font-size:14px;font-weight:600}button:active{transform:scale(.98);background:#2b3345}button:disabled{opacity:.35}.primary{border-color:#5d7965;background:#203027}.locked{border-color:#4d4a3d;color:#d8cfaa}
.log{margin-top:9px;max-height:190px;overflow:auto;font-size:12px;line-height:1.6;color:#c9d0dd}.log div{padding:5px 0;border-bottom:1px solid #272d39}.clue{color:var(--clue)}.success{color:var(--accent);font-weight:600}.note{color:var(--muted);font-size:10px;margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>六界石・最小体験プロトタイプ v2</h1>
<div class="sub">目的：未知の六界石を、会話と観察から推理し、自分で探して発見する。石は発見するまで画面に表示しない。</div>
<div class="world" id="world">
  <div class="compass"><b>N</b><br>↑<br>W ← → E<br>↓<br>S</div>
  <div class="region ne"></div><div class="region center"></div><div class="region sw"></div>
  <div class="region-label r-ne">森の北東</div><div class="region-label r-center">森の中央</div><div class="region-label r-sw">森の南西</div>
  <div class="player" id="player"></div><div class="npc" id="npc"></div>
</div>
<div class="panel">
  <div class="status" id="status"></div>
  <div class="buttons">
    <button id="talkBtn">旅人に話す</button>
    <button id="observeBtn">周囲を観察する</button>
    <button id="searchBtn" class="primary">石を探す</button>
    <button id="touchBtn" class="locked" disabled>石に触れる</button>
  </div>
  <div class="log" id="log"></div>
  <div class="note">操作：フィールドをタップして自由移動。まず情報を集め、気になる場所へ移動して観察し、仮説を立てて「石を探す」。発見後だけ「石に触れる」が有効になる。</div>
</div>
</main>
<script>
const state={player:{x:18,y:72,knowledge:{travelerRumor:false,observedNE:false,stoneKnown:false}},stone:{x:76,y:25,discovered:false,active:true},npc:{x:42,y:70,talkCount:0},log:[],phase:'unknown'};
const $=id=>document.getElementById(id),world=$("world"),playerEl=$("player"),npcEl=$("npc"),statusEl=$("status"),logEl=$("log");
function clamp(v,min,max){return Math.max(min,Math.min(max,v))} function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)} function stoneDistance(){return Math.hypot(state.player.x-state.stone.x,state.player.y-state.stone.y)}
function addLog(t,cls=''){state.log.push({t,cls});render()}
function render(){playerEl.style.left=state.player.x+'%';playerEl.style.top=state.player.y+'%';npcEl.style.left=state.npc.x+'%';npcEl.style.top=state.npc.y+'%';const nearNpc=dist(state.player,state.npc)<14;let s='森を歩いている。';if(nearNpc)s+=' 旅人が近くにいる。';if(state.player.knowledge.travelerRumor&&!state.player.knowledge.observedNE)s+=' 旅人から聞いた話が気になっている。';if(state.player.knowledge.observedNE&&!state.player.knowledge.stoneKnown)s+=' この辺りには何か手掛かりがある。';if(state.player.knowledge.stoneKnown&&!state.stone.discovered)s+=' 石がこの近くにあるという仮説が強まった。';if(state.stone.discovered)s+=' 六界石を発見した。';statusEl.textContent=s;logEl.innerHTML=state.log.map(x=>`<div class="${x.cls}">${x.t}</div>`).join('');logEl.scrollTop=logEl.scrollHeight;$("touchBtn").disabled=!state.stone.discovered;$("touchBtn").classList.toggle('locked',!state.stone.discovered);$("touchBtn").classList.toggle('primary',state.stone.discovered)}
world.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=world.getBoundingClientRect();state.player.x=clamp((e.clientX-r.left)/r.width*100,4,96);state.player.y=clamp((e.clientY-r.top)/r.height*100,7,94);addLog('MANAはその場所へ歩いた。')});
$("talkBtn").onclick=()=>{if(dist(state.player,state.npc)>16){addLog('旅人は少し離れている。近づいて話してみよう。');return}if(state.npc.talkCount===0){state.npc.talkCount=1;state.player.knowledge.travelerRumor=true;addLog('旅人「その石なら、昔ここで見たって話を聞いたことがある。」');addLog('旅人「森の北東に不思議な石があるって話だったよ。」','clue')}else addLog('旅人「森の北東……だったと思う。昔の話だから、確かじゃないけど。」');render()};
$("observeBtn").onclick=()=>{const p=state.player;if(p.y<48&&p.x>52){if(!state.player.knowledge.observedNE){state.player.knowledge.observedNE=true;addLog('周囲を観察する。','clue');addLog('近くの草木だけ、季節より少し早く芽吹いている。','clue');addLog('旅人の話と、この場所の変化が結びつく。','clue')}else addLog('もう一度観察した。やはり、この辺りだけ草木の様子が違う。','clue')}else{addLog('周囲は普通の森に見える。');if(state.player.knowledge.travelerRumor)addLog('旅人の話を確かめるなら、北東の方を見てみる必要がありそうだ。','clue')}};
$("searchBtn").onclick=()=>{if(state.stone.discovered){addLog('もう六界石は発見している。','success');return}const d=stoneDistance();if(d<13){state.stone.discovered=true;state.player.knowledge.stoneKnown=true;state.phase='discovered';addLog('周囲を探す。……何かが、草の陰にある。','success');addLog('六界石を発見した。','success')}else if(state.player.knowledge.observedNE){addLog('この辺りを探したが、六界石は見つからなかった。');addLog('観察で得た手掛かりをもう少し絞り込めそうだ。','clue')}else if(state.player.knowledge.travelerRumor){addLog('この辺りには六界石の手掛かりがないようだ。旅人の話を思い出す。','clue')}else addLog('探したが、何を手掛かりにすればいいのか分からない。まず周囲や旅人から情報を集めよう。');render()};
$("touchBtn").onclick=()=>{if(!state.stone.discovered)return;addLog('六界石に触れる。冷たいはずなのに、掌の奥だけがわずかに温かい。','success');addLog('発見後の接触まで成立。ここで最小体験を終了できる。','success')};
// 第二段階用の既存機能は、この最小体験ではUIから切り離して保持する。
const legacyActions={bringTraveler(){},hideStone(){},discussStone(){},lieToTraveler(){},wait(){},plant(){},moveStone(){},searchHiddenStone(){}};
addLog('世界が生成された。六界石の場所は、最初からは分からない。');render();
</script>
</body>
</html>
