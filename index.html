<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131b">
<title>六界石・実験場プロトタイプ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f1219;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
main{max-width:760px;margin:auto;padding:18px 14px 32px}h1{font-size:21px;margin:0 0 5px}.sub{font-size:13px;color:#aeb7c7;line-height:1.5;margin-bottom:14px}
#world{position:relative;height:390px;border:1px solid #303747;border-radius:18px;overflow:hidden;background:linear-gradient(#17271b,#0c1510);touch-action:manipulation;user-select:none;-webkit-user-select:none}
#world:before{content:"";position:absolute;inset:0;opacity:.2;background-image:linear-gradient(35deg,transparent 48%,#718064 49%,transparent 51%),linear-gradient(-35deg,transparent 48%,#718064 49%,transparent 51%);background-size:90px 90px}
.label{position:absolute;z-index:2;left:12px;top:10px;font-size:12px;color:#d9e2d6;pointer-events:none}
.obj{position:absolute;z-index:3;transform:translate(-50%,-50%);pointer-events:none}
.player{width:34px;height:34px;border-radius:50%;background:#dce8ff;border:3px solid #7185aa;box-shadow:0 0 14px #b9d0ff88}
.stone{width:42px;height:50px;background:linear-gradient(145deg,#e4f6df,#83b891 55%,#436b4c);clip-path:polygon(50% 0,91% 27%,78% 82%,50% 100%,20% 82%,8% 27%);filter:drop-shadow(0 0 12px #a7e3ae88)}
.npc{width:32px;height:32px;border-radius:8px;background:#d0a5e8;border:3px solid #76568a}
.seed{position:absolute;z-index:3;width:16px;height:16px;transform:translate(-50%,-50%);pointer-events:none}.seed-dot{width:12px;height:12px;border-radius:50%;background:#a9d39e;border:2px solid #5c8558}.plant-label{font-size:9px;color:#dbe8d5;margin-top:2px;white-space:nowrap;text-align:center}
.signal{position:absolute;z-index:2;width:10px;height:10px;border-radius:50%;background:#ddd;box-shadow:0 0 16px #fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.7);opacity:.35}}
.panel{margin-top:12px;padding:13px;border:1px solid #303747;border-radius:16px;background:#181c27}.status{font-size:14px;line-height:1.55;min-height:60px}
.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}button{border:1px solid #3b4558;background:#222838;color:#fff;border-radius:12px;min-height:48px;font-size:14px;font-weight:600}button:active{background:#30394d;transform:scale(.98)}
.log{margin-top:10px;max-height:190px;overflow:auto;font-size:12px;line-height:1.6;color:#c9d0dd}.log div{padding:5px 0;border-bottom:1px solid #272d39}.note{color:#8f99aa;font-size:11px;margin-top:9px}
</style>
</head>
<body>
<main>
<h1>六界石・実験場プロトタイプ</h1>
<div class="sub">小さな森に、ひとつの「何か」がある。正解を探すより、気になったことを試してみよう。</div>
<div id="world">
<div class="label">森 ― 好きな場所をタップして歩く</div>
<div id="player" class="obj player"></div><div id="stone" class="obj stone"></div><div id="npc" class="obj npc"></div>
<div id="seed" class="obj seed" style="display:none"></div><div id="signal" class="signal" style="display:none"></div>
</div>
<div class="panel">
<div id="status" class="status"></div>
<div class="buttons">
<button id="touch">石に触れる</button><button id="plant">植物を植える</button>
<button id="talk">旅人に話す</button><button id="bring">旅人を連れてくる</button>
<button id="hide">石を隠す</button><button id="tell">石の話をする</button>
<button id="lie">旅人に嘘をつく</button><button id="wait">しばらく待つ</button>
<button id="search">石を探す</button><button id="observe">周囲を観察する</button>
</div>
<div id="log" class="log"></div>
<div class="note">実験の基本：観察 → 仮説 → 行動 → 予想外の反応 → もう一度試す。</div>
</div>
</main>
<script>
const S={
 p:{x:18,y:68,knows:false}, s:{x:68,y:34,known:false,moved:false,hidden:false,touched:0},
 n:{x:43,y:72,near:false,records:[]}, plants:[],waiting:0,logs:[],signal:false
};
const $=id=>document.getElementById(id),world=$("world");
function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function nearStone(){return d(S.p,S.s)<15}
function nearNpc(){return d(S.p,S.n)<15}
function log(t){S.logs.push(t);render()}
function render(){
 $("player").style.left=S.p.x+"%";$("player").style.top=S.p.y+"%";
 $("stone").style.left=S.s.x+"%";$("stone").style.top=S.s.y+"%";
 $("npc").style.left=S.n.x+"%";$("npc").style.top=S.n.y+"%";
 $("stone").style.display=S.s.hidden?"none":"block";
$("plants").innerHTML=S.plants.map((p,i)=>{
 const names=["種","芽","葉","蕾","花"];
 return '<div class="seed" style="left:'+p.x+'%;top:'+p.y+'%"><div class="seed-dot"></div><div class="plant-label">'+names[p.growth]+'</div></div>';
 }).join("");
 $("signal").style.display=S.signal?"block":"none";$("signal").style.left="82%";$("signal").style.top="70%";
 let t=nearStone()&&!S.s.hidden?"妙な気配がする。":"森を歩いている。";
 if(S.p.knows)t+=" あの場所について、何かを知っている。";
 if(S.plants.length)t+=` 植物：${S.plants.length}本。`;
 if(S.s.hidden)t+=" 石は見えない。";
 if(S.n.near)t+=" 旅人が石の近くにいる。";
 $("status").textContent=t;$("log").innerHTML=S.logs.map(x=>"<div>"+x+"</div>").join("");$("log").scrollTop=99999;
}
world.addEventListener("pointerup",e=>{
 if(e.target!==world)return;
 const r=world.getBoundingClientRect();
 S.p.x=Math.max(3,Math.min(97,(e.clientX-r.left)/r.width*100));S.p.y=Math.max(5,Math.min(95,(e.clientY-r.top)/r.height*100));
 log("MANAは森の別の場所へ歩いた。");
});
$("touch").onclick=()=>{
 if(S.s.hidden){log("そこに石は見当たらない。");return}
 if(!nearStone()){log("石は少し遠い。近づいてみよう。");return}
 S.s.known=true;S.p.knows=true;S.s.touched++;
 log("石に触れた。冷たいはずなのに、掌の奥だけがわずかに温かい。");
 if(S.s.touched===1)log("atOS記録：未分類の共鳴反応。対象の正体は判定不能。");
 else if(S.s.touched===2)log("今度は、触れる直前に石の位置がほんの少しずれた気がした。");
 else log("今回は何も起きない。……本当に？");
};
$("plant").onclick=()=>{
 const x=S.p.x,y=S.p.y, near=nearStone()&&!S.s.hidden;
 const p={x,y,growth:1,nearStone:near};
 S.plants.push(p);
 log(near?"石の近くに小さな種を植えた。":"森の一角に小さな種を植えた。");
 log(near?(S.s.touched>0?"土の中から、ほんの一瞬だけ淡い光が見えた。":"今のところ、普通の種にしか見えない。"):"石から離れた場所では、今のところ普通の種に見える。");
};
$("talk").onclick=()=>{
 if(S.n.near){
   log(S.n.knows?"旅人「近くで見ると……やっぱり変だな。この石、誰かの後を追ってるのか？」":"旅人「この近く、なんだか落ち着かないね。」");
 }else log("旅人「この森には、昔から変な場所があるらしいよ。」");
};
$("bring").onclick=()=>{
 if(!S.p.knows){log("まずは自分で何か見つけてみよう。");return}
 S.n.x=S.s.x-18;S.n.y=S.s.y+18;S.n.near=true;
 log("MANAは旅人を石の近くまで連れてきた。");
 if(S.seed)log("旅人「……植物まで、ここの周りだけ妙だね。」");
};
$("tell").onclick=()=>{
 if(!S.p.knows){log("まだ旅人に伝えられるほどの情報がない。");return}
 S.n.records.push({text:"森の北東に不思議な石がある",type:"証言",certainty:.72});
 log("MANAは旅人に石について知っていることを話した。");
 log("旅人の記録に新しい情報が加わった：『森の北東に不思議な石がある』／確信度72%");
};
$("lie").onclick=()=>{
 S.n.records.push({text:"石は森の西側にある",type:"証言",certainty:.25,suspicious:true});
 log("MANAは旅人に、石は『森の西側にある』と嘘をついた。");
 log("旅人は少し疑っているが、以前の情報を捨ててはいない。");
};
$("hide").onclick=()=>{
 if(!nearStone()){log("隠すなら石のそばまで行こう。");return}
 S.s.hidden=true;S.p.knows=true;
 log("MANAは石を草むらの奥へ隠した。見た目には完全に見えなくなった。");
};
$("wait").onclick=()=>{
 S.waiting++;
 log("しばらく何もせず、森を眺めた。");
 if(S.waiting===1){S.signal=true;log("遠くで、何かが一度だけ光った。");}
 else if(S.waiting===2){
   S.signal=false;
   const old={x:S.s.x,y:S.s.y};const spots=[[78,62],[25,25],[61,78],[83,25]];
   const q=spots[Math.floor(Math.random()*spots.length)];
   const dx=q[0]-old.x,dy=q[1]-old.y;
   if(!S.s.hidden){
     S.s.x=q[0];S.s.y=q[1];S.s.moved=true;
     S.plants.forEach(p=>{if(p.nearStone){p.x+=dx;p.y+=dy;p.carried=true;p.growth=Math.min(4,p.growth+1);}});
     log("……いつの間にか、石が別の場所にある。");
     const carried=S.plants.filter(p=>p.carried).length;
     if(carried)log("石の近くに植えた植物も、石と一緒に移動している。理由は分からない。");
     log("世界記録：石の移動原因は記録されていない。");
     if(S.n.records.length)log("旅人は複数の情報を保持している。古い記録も消えていない。");
   }else{S.s.hidden=false;S.s.x=78;S.s.y=62;log("隠したはずの石が、森の別の場所に現れている。");}
 }else{log("風が通った。鳥が鳴いた。世界は何も説明してくれない。");}
};
$("search").onclick=()=>{
 if(!S.s.hidden && nearStone()){S.p.knows=true;log("探索の末、石を見つけた。");return}
 if(S.s.hidden){
   const chance=Math.random();
   if(chance>.45){S.s.hidden=false;S.p.knows=true;log("草むらを調べて、石を見つけた。……隠した場所から少しずれている。");}
   else log("探したが見つからない。草むらには、奇妙な跡だけが残っている。");
 }else{log("探索したが、石は見つからなかった。");if(S.n.records.length)log("旅人「前に聞いた場所の記録も残っている。どの話が正しいんだろう……」");}
};
$("observe").onclick=()=>{
 if(S.signal){S.signal=false;log("遠くの地面に、小さな焦げ跡がある。何が起きたのかは分からない。");return}
 if(S.plants.length){
   S.plants.forEach(p=>{if(p.growth<4)p.growth++;});
   const names=["種","芽","葉","蕾","花"];
   const summary=S.plants.map((p,i)=>`植物${i+1}：${names[p.growth]}${p.nearStone?"（石の近く）":"（遠い場所）"}`).join("／");
   log("植物を観察した。"+summary);
   const near=S.plants.filter(p=>p.nearStone),far=S.plants.filter(p=>!p.nearStone);
   if(near.length&&far.length)log("石の近くと遠くの植物を比べられる。成長速度に違いがあるようだ。");
 }else if(S.s.moved)log("石がいた場所の草だけ、周囲よりわずかに濃い。");
 else log("周囲は普通の森に見える。……少なくとも、今は。");
};
log("世界が生成された。森には、ひとつの『何か』が存在している。");
log("植える場所は自由だ。石の近くと遠くで、何か違いがあるかもしれない。");
render();
</script>
</body>
</html>
