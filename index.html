<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131b">
<title>六界石・最小プロトタイプ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f1219;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
main{max-width:760px;margin:auto;padding:18px 14px 32px}h1{font-size:21px;margin:0 0 5px}.sub{font-size:13px;color:#aeb7c7;line-height:1.5;margin-bottom:14px}
#world{position:relative;height:390px;border:1px solid #303747;border-radius:18px;overflow:hidden;background:linear-gradient(#17271b,#0c1510);touch-action:manipulation;user-select:none;-webkit-user-select:none}
#world:before{content:"";position:absolute;inset:0;opacity:.2;background-image:linear-gradient(35deg,transparent 48%,#718064 49%,transparent 51%),linear-gradient(-35deg,transparent 48%,#718064 49%,transparent 51%);background-size:90px 90px}
.label{position:absolute;z-index:2;left:12px;top:10px;font-size:12px;color:#d9e2d6;pointer-events:none}
.obj{position:absolute;z-index:3;transform:translate(-50%,-50%);pointer-events:none}
.player{width:34px;height:34px;border-radius:50%;background:#dce8ff;border:3px solid #7185aa;box-shadow:0 0 14px #b9d0ff88}
.stone{width:42px;height:50px;background:linear-gradient(145deg,#e4f6df,#83b891 55%,#436b4c);clip-path:polygon(50% 0,91% 27%,78% 82%,50% 100%,20% 82%,8% 27%);filter:drop-shadow(0 0 12px #a7e3ae88)}
.npc{width:32px;height:32px;border-radius:8px;background:#d0a5e8;border:3px solid #76568a}
.panel{margin-top:12px;padding:13px;border:1px solid #303747;border-radius:16px;background:#181c27}.status{font-size:14px;line-height:1.55;min-height:48px}
.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}button{border:1px solid #3b4558;background:#222838;color:#fff;border-radius:12px;min-height:50px;font-size:14px;font-weight:600}button:active{background:#30394d;transform:scale(.98)}
.log{margin-top:10px;max-height:180px;overflow:auto;font-size:12px;line-height:1.6;color:#c9d0dd}.log div{padding:5px 0;border-bottom:1px solid #272d39}.note{color:#8f99aa;font-size:11px;margin-top:9px}
</style>
</head>
<body>
<main>
<h1>六界石・最小プロトタイプ</h1>
<div class="sub">生命の石を1個だけ置いた「世界状態テスト」。石の正体はゲーム内では明示しません。森をタップして移動できます。</div>
<div id="world">
<div class="label">小さな森 ― 画面の好きな場所をタップ</div>
<div id="player" class="obj player"></div><div id="stone" class="obj stone"></div><div id="npc" class="obj npc"></div>
</div>
<div class="panel">
<div id="status" class="status"></div>
<div class="buttons">
<button id="touch">石に触れる</button><button id="talk">旅人に話す</button>
<button id="tell">石の話をする</button><button id="move">石が移動する</button>
<button id="search">石を探す</button><button id="observe">周囲を観察する</button>
</div>
<div id="log" class="log"></div>
<div class="note">実験ループ：発見 → 接触 → 記録 → 情報共有 → 石の移動 → 世界状態変化 → 古い情報 → 再探索</div>
</div>
</main>
<script>
const S={p:{x:18,y:68,knows:false},s:{x:68,y:34,known:false,moved:false},n:{x:43,y:72,knows:false,certainty:0},growth:0,logs:[]};
const $=id=>document.getElementById(id),world=$("world");
function dist(){return Math.hypot(S.p.x-S.s.x,S.p.y-S.s.y)}
function log(t){S.logs.push(t);render()}
function render(){
$("player").style.left=S.p.x+"%";$("player").style.top=S.p.y+"%";
$("stone").style.left=S.s.x+"%";$("stone").style.top=S.s.y+"%";
$("npc").style.left=S.n.x+"%";$("npc").style.top=S.n.y+"%";
let t=dist()<14?"近くに、妙な気配がある。":"森を歩いている。";
if(S.p.knows)t+=" あの石について知っている。";
if(S.n.knows)t+=` 旅人も石の話を知っている（確信度 ${Math.round(S.n.certainty*100)}%）。`;
t+=` 周囲の植物の変化：${S.growth}段階。`;$("status").textContent=t;
$("log").innerHTML=S.logs.map(x=>"<div>"+x+"</div>").join("");$("log").scrollTop=99999;
}
world.addEventListener("pointerup",e=>{
if(e.target!==world)return;
const r=world.getBoundingClientRect();
S.p.x=Math.max(3,Math.min(97,(e.clientX-r.left)/r.width*100));
S.p.y=Math.max(5,Math.min(95,(e.clientY-r.top)/r.height*100));
log("MANAは森の別の場所へ歩いた。");
});
$("touch").onclick=()=>{if(dist()>14){log("石は少し遠い。近づいてみよう。");return}S.s.known=true;S.p.knows=true;log("石に触れた。冷たいはずなのに、掌の奥だけがわずかに温かい。");log("atOS記録：未分類の共鳴反応。対象の正体は判定不能。")};
$("talk").onclick=()=>log(S.n.knows?"旅人「石なら……前に聞いた場所だったと思う。たぶん。」":"旅人「この森には、昔から変な場所があるらしいよ。」");
$("tell").onclick=()=>{if(!S.p.knows){log("まだ旅人に伝えられるほどの情報がない。");return}S.n.knows=true;S.n.certainty=.72;log("MANAは旅人に石の場所と見たことを話した。");log("旅人の記録：『森の北東に不思議な石がある』／確信度72%")};
$("move").onclick=()=>{let a=[[78,62],[25,25],[61,78],[83,25]],p=a[Math.floor(Math.random()*a.length)];S.s.x=p[0];S.s.y=p[1];S.s.moved=true;S.growth++;log("世界記録：石の位置が変化した。誰が動かしたのかは分からない。");log("世界記録：石の近くで植物の生育が少し変化した。");if(S.n.knows)log("旅人の知識は更新されない。古い場所を覚えたままだ。")};
$("search").onclick=()=>{if(dist()<14){S.p.knows=true;log("探索の末、石を見つけた。")}else{log("探索したが、石は見つからなかった。");if(S.n.knows)log("旅人「前に聞いた場所なら、あっちだったはずだけど……」")}};
$("observe").onclick=()=>log(S.growth?"近くの草木だけ、季節より少し早く芽吹いている。原因は分からない。":"周囲は普通の森に見える。");
log("世界が生成された。森には、ひとつの『何か』が存在している。");render();
</script>
</body>
</html>
